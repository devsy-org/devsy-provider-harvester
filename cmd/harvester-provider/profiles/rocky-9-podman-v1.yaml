#cloud-config
hostname: {{quote .VMName}}
manage_etc_hosts: true
ssh_pwauth: false
users:
  - name: {{quote .SSHUser}}
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - {{quote .SSHPublicKey}}
write_files:
  - path: /usr/local/sbin/devsy-podman-bootstrap
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      stage=platform
      trap 'echo "devsy bootstrap failed at ${stage}; inspect /var/log/cloud-init-output.log" >&2' ERR
      . /etc/os-release
      if [[ "$ID" != rocky || "${VERSION_ID%%.*}" != 9 ]]; then
        echo 'devsy bootstrap requires a Rocky Linux 9 cloud image' >&2
        exit 1
      fi
      stage=podman-packages
      echo "devsy bootstrap: $stage"
      dnf -y --setopt=retries=3 install podman qemu-guest-agent slirp4netns fuse-overlayfs
      stage=user-session
      echo "devsy bootstrap: $stage"
      loginctl enable-linger {{.SSHUser}}
      guest_uid=$(id -u {{.SSHUser}})
      systemctl start "user@${guest_uid}.service"
      systemctl start qemu-guest-agent
      runuser -u {{.SSHUser}} -- env XDG_RUNTIME_DIR="/run/user/${guest_uid}" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${guest_uid}/bus" podman info >/dev/null
      echo 'devsy bootstrap: complete'
runcmd:
  - [timeout, '--kill-after=30', '840', /usr/local/sbin/devsy-podman-bootstrap]
